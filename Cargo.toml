[package]
name = "cc-speaks"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
espeakng-sys = { path = "espeakng-sys" }
form_urlencoded = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
rustix = { version = "1.1.4", features = ["net"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace]
resolver = "3"
members = [".", "espeakng-sys"]

[workspace.package]
version = "0.1.0"
edition = "2024"
